<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Ordre des clés 1, 2, 1, 3, 2</title><desc id="desc">Cas documenté uniquement. Audio préalable si nécessaire puis cinq passages avec trois clés. Les messages de fin déterminent les actions.</desc><rect x="0" y="0" width="1200" height="600" rx="24" fill="#f4f8fa" stroke="none"/><text x="40" y="54" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17334b">Le parcours du cas Panasonic / JBL documenté</text><text x="40" y="92" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334b">Seulement après identification, prérequis examinés et fichiers vérifiés.</text><rect x="40" y="121" width="1120" height="60" rx="18" fill="#fff4e5" stroke="none"/><text x="62" y="160" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#ab5914">Avant : Audio 1000 vers 1046, avec un support séparé dans notre cas.</text><rect x="40" y="209" width="208" height="230" rx="18" fill="#fff" stroke="none"/><rect x="104" y="229" width="80" height="94" rx="18" fill="#087e83" stroke="none"/><rect x="119" y="219" width="50" height="20" rx="3" fill="#b8c9d3" stroke="none"/><text x="131" y="292" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#fff">1</text><text x="56" y="366" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17334b">Préparation</text><text x="56" y="403" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#17334b">Attendre DONE</text><text x="251" y="291" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#087e83">›</text><rect x="268" y="209" width="208" height="230" rx="18" fill="#fff" stroke="none"/><rect x="332" y="229" width="80" height="94" rx="18" fill="#17334b" stroke="none"/><rect x="347" y="219" width="50" height="20" rx="3" fill="#b8c9d3" stroke="none"/><text x="359" y="292" font-family="A