<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="355" viewBox="0 0 1200 355" role="img" aria-labelledby="title desc"><title id="title">Identifier, comparer, préparer</title><desc id="desc">Trois étapes avant toute installation : identifier le poste sans clé, comparer la configuration, puis préparer les supports.</desc><rect x="0" y="0" width="1200" height="355" rx="24" fill="#f4f8fa" stroke="none"/><text x="40" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17334b">Android Auto sur Prius IV : commencer par le bon poste</text><text x="40" y="91" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17334b">Un guide communautaire. Une configuration réussie, pas tous les autoradios.</text><rect x="40" y="125" width="354" height="200" rx="18" fill="#fff" stroke="none"/><rect x="60" y="145" width="50" height="50" rx="25" fill="#087e83" stroke="none"/><text x="77" y="179" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">1</text><text x="60" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17334b">IDENTIFIER</text><text x="60" y="263" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17334b">Relever DCU, MEU, versions</text><text x="60" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#087e83">Sans clé de mise à jour.</text><rect x="422" y="125" width="354" height="200" rx="18" fill="#fff" stroke="none"/><rect x="442" y="145" width="50" height="50" rx="25" fill="#087e83" stroke="none"/><text x="459" y="179" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">2</text><text x="442" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17334b">COMPARER</text><text x="442" y="263" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17334b">Vérifier matériel et prérequis</text><text x="442" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#087e83">Une inconnue reste inconnue.</text><rect x="804" y="125" width="354" height="200" rx="18" fill="#fff" stroke="none"/><rect x="824" y="145" width="50" height="50" rx="25" fill="#087e83" stroke="none"/><text x="841" y="179" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="white">3</text><text x="824" y="225" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17334b">PRÉPARER</text><text x="824" y="263" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17334b">Contrôler les fichiers et les clés</text><text x="824" y="297" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#087e83">Suivre ensuite le tutoriel.</text></svg>