<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Lire les identifiants de son autoradio</title><desc id="desc">Exemple fictif reprenant les valeurs avant conversion du cas documenté. Relever ses propres valeurs et masquer les identifiants uniques.</desc><rect x="0" y="0" width="1200" height="620" rx="24" fill="#f4f8fa" stroke="none"/><text x="40" y="56" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17334b">Que faut-il relever dans la voiture ?</text><text x="40" y="91" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17334b">Menu &gt; Configuration / SETUP &gt; Général &gt; Mise à jour du logiciel</text><rect x="40" y="126" width="695" height="366" rx="18" fill="#17334b" stroke="none"/><rect x="60" y="145" width="655" height="328" rx="12" fill="#fff" stroke="none"/><text x="82" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#087e83">EXEMPLE PÉDAGOGIQUE - pas une capture réelle</text><text x="84" y="219" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17334b">Model ID DCU</text><text x="380" y="219" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17334b">17TDT2EU-DA01</text><path d="M82 233 H690" stroke="#dbe6eb"/><text x="84" y="267" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17334b">Model ID MEU</text><text x="380" y="267" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17334b">17TMT2EU-FA00</text><path d="M82 281 H690" stroke="#dbe6eb"/><text x="84" y="315" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17334b">Audio</text><text x="380" y="315" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17334b">1000</text><path d="M82 329 H690" stroke="#dbe6eb"/><text x="84" y="363" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17334b">Navigation</text><text x="380" y="363" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17334b">1512</text><path d="M82 377 H690" stroke="#dbe6eb"/><text x="84" y="411" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17334b">navdb_version</text><text x="380" y="411" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#17334b">943</text><path d="M82 425 H690" stroke="#dbe6eb"/><text x="770" y="162" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17334b">DCU : unité principale</text><text x="770" y="197" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334b">MEU : module de navigation</text><text x="770" y="250" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17334b">Audio / Navigation</text><text x="770" y="285" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334b">= versions des logiciels</text><text x="770" y="338" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17334b">navdb_version</text><text x="770" y="373" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334b">= version des cartes</text><text x="770" y="431" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#087e83">Recopier VOS valeurs.</text><text x="770" y="465" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17334b">Sinon : « inconnu ».</text><text x="40" y="540" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#17334b">À relever aussi : références de pièces, fabricant, région, JBL, navigation, DAB et CD.</text><text x="40" y="580" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#ab5914">Masquer VIN et numéros de série. L’apparence de l’écran ne prouve pas la compatibilité.</text></svg>